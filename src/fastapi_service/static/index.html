<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>任务管理 · FastAPI Service</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="/"><span class="brand-mark">F</span><span>FastAPI Service <small>工作台</small></span></a><div><span id="current-user" class="user-label"></span><button id="logout" class="button subtle" type="button" hidden>退出登录</button> <a class="api-link" href="/docs">API 文档 ↗</a></div></div></header>
<main class="container">
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<section id="auth-panel" class="auth-panel panel" hidden><p class="eyebrow">WELCOME</p><h1>登录工作台</h1><p class="dialog-intro">登录后管理你的任务，或注册一个新账号。</p><form id="auth-form"><label for="username">用户名</label><input id="username" autocomplete="username" required maxlength="100"><label for="password">密码 <span class="optional">至少 8 位</span></label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="1024" required><p id="auth-error" class="form-error" role="alert" hidden></p><div class="auth-actions"><button class="button primary" id="login" type="submit">登录</button><button class="button secondary" id="register" type="button">注册并登录</button></div></form></section>
<section id="workspace" hidden><div class="page-heading"><div><p class="eyebrow">WORKSPACE / TASKS</p><h1>任务管理</h1><p class="subtitle">记录进展，专注做好每一件事。</p></div><button class="button primary" id="new-task" type="button">＋ 新建任务</button></div>
<section class="panel" aria-labelledby="list-title"><div class="panel-header"><div><h2 id="list-title">我的任务 <span id="count" class="count">—</span></h2><p>查看并维护你的任务</p></div><button class="button subtle" id="refresh" type="button">↻ 刷新</button></div><div id="loading" class="empty">正在加载任务…</div><div id="empty" class="empty" hidden><div class="empty-icon">◇</div><strong>还没有任务</strong><p>创建第一个任务，开始规划吧。</p><button class="button secondary" id="empty-create" type="button">创建任务</button></div><div class="table-wrap" id="table-wrap" hidden><table><thead><tr><th>任务</th><th>状态</th><th>创建时间</th><th><span class="sr-only">操作</span></th></tr></thead><tbody id="tasks"></tbody></table></div></section></section><footer><span>FastAPI Service</span><span>任务数据保存在 PostgreSQL 中</span></footer></main>
<dialog id="task-dialog" aria-labelledby="dialog-title"><form id="task-form"><div class="dialog-header"><div><p class="eyebrow">TASK DETAILS</p><h2 id="dialog-title">新建任务</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="关闭">×</button></div><p class="dialog-intro">填写任务的基本信息。</p><label for="title">标题 <span>*</span></label><input id="title" maxlength="100" required placeholder="输入任务标题"><label for="description">描述 <span class="optional">选填</span></label><textarea id="description" maxlength="1000" rows="3" placeholder="添加一些说明"></textarea><label for="status">状态</label><select id="status"><option value="todo">待办</option><option value="in_progress">进行中</option><option value="done">已完成</option></select><p id="form-error" class="form-error" role="alert" hidden></p><div class="dialog-actions"><button class="button secondary" id="cancel" type="button">取消</button><button class="button primary" id="save" type="submit">保存任务</button></div></form></dialog>
</body></html>
