[project]
name = "fastapi-service"
version = "0.1.0"
description = "A FastAPI web service scaffolded with uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.7",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
fastapi-service = "fastapi_service.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    # pgserver only publishes wheels for CPython <= 3.12. It exists so the
    # test suite can run without Docker; CI uses a real Postgres service.
    "pgserver>=0.1.4; python_version < '3.13'",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
