services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_service
    ports:
      # Host port 5433 by default: on WSL with mirrored networking the host
      # itself may already hold 5432. Override with POSTGRES_PORT.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 moved the data directory: the image expects a single
      # mount at /var/lib/postgresql and puts the cluster in a version-specific
      # subdirectory. Mounting /var/lib/postgresql/data makes it refuse to start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: applies the Alembic migrations before the app starts.
  migrate:
    build: .
    # Both services use the same image.
    image: fastapi-service
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FASTAPI_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/fastapi_service

  app:
    build: .
    image: fastapi-service
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      FASTAPI_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/fastapi_service
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000

volumes:
  pgdata:
